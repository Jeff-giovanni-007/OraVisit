spring.application.name=oravisit-backend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
spring.profiles.default=dev

spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oravisit}
spring.datasource.username=${DB_USERNAME:oravisit}
spring.datasource.password=${DB_PASSWORD:oravisit}
spring.datasource.hikari.pool-name=oravisit-pool
spring.datasource.hikari.maximum-pool-size=10

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

spring.data.web.pageable.max-page-size=100

server.port=${SERVER_PORT:8080}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.timezone=${APP_TIMEZONE:Africa/Lome}
app.jwt-secret=${APP_JWT_SECRET:}
app.jwt-expiration=${APP_JWT_EXPIRATION:PT8H}
app.jwt-issuer=${APP_JWT_ISSUER:oravisit}
app.cors-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.mail-from=${APP_MAIL_FROM:OraVisit <no-reply@orabank.tg>}
app.mail-preview-host=${APP_MAIL_PREVIEW_HOST:}
app.mail-preview-port=${APP_MAIL_PREVIEW_PORT:1025}
app.password-setup-link-validity=${APP_PASSWORD_SETUP_LINK_VALIDITY:PT48H}
app.log-password-setup-links=false

logging.level.root=INFO
