<header class="header">
  <div class="left">
    <button type="button" class="drawer-toggle" (click)="toggleDrawer()"
            aria-controls="app-drawer" [attr.aria-expanded]="drawerOpen()"
            [attr.aria-label]="drawerOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
            [title]="drawerOpen() ? 'Fermer le menu' : 'Ouvrir le menu'">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <div class="brand">
      <span class="brand-text">GESTION DES VISITES</span>
    </div>
  </div>
  <div class="user">
    <span class="user-name">{{ auth.currentUser()?.firstName }} {{ auth.currentUser()?.lastName }}</span>
    <span class="role">{{ roleLabel() }}</span>
    <button type="button" (click)="logout()">Déconnexion</button>
  </div>
</header>
<div class="layout">
  <aside id="app-drawer" [class.closed]="!drawerOpen()" [attr.inert]="drawerOpen() ? null : ''">
    @for (item of nav(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" (click)="onNavigate()"
         [routerLinkActiveOptions]="{ exact: item.path === '/' }"
         [title]="item.label" [attr.aria-label]="item.label">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @switch (item.icon) {
            @case ('visite') {
              <rect x="3.5" y="5" width="17" height="16" rx="2" />
              <path d="M8 3v4M16 3v4M3.5 10h17" />
              <path d="M9.2 15.4l1.9 1.9 3.7-3.7" />
            }
            @case ('visiteurs') {
              <rect x="2.5" y="5" width="19" height="14" rx="2" />
              <circle cx="8.6" cy="11" r="2.2" />
              <path d="M5.2 16.3c.6-1.5 1.9-2.3 3.4-2.3s2.8.8 3.4 2.3" />
              <path d="M15 10.2h4M15 13.6h3" />
            }
            @case ('employes') {
              <circle cx="9.5" cy="8.5" r="3" />
              <path d="M3.5 19.8c0-3.1 2.7-5.1 6-5.1s6 2 6 5.1" />
              <path d="M16.2 6.1a3 3 0 0 1 0 5.8" />
              <path d="M17.8 14.9c1.9.7 3 2.2 3 4.4" />
            }
            @case ('audit') {
              <path d="M18.5 10.5V8L14 3.5H6.8A1.3 1.3 0 0 0 5.5 4.8v14.4a1.3 1.3 0 0 0 1.3 1.3H11" />
              <path d="M13.8 3.6V8h4.4" />
              <path d="M8.4 10.2h4M8.4 13.4h2.6" />
              <circle cx="16.6" cy="16.6" r="3.1" />
              <path d="M18.9 18.9l2.1 2.1" />
            }
          }
        </svg>
      </a>
    }
  </aside>
  @if (compact() && drawerOpen()) {
    <div class="backdrop" (click)="drawerOpen.set(false)"></div>
  }
  <main><router-outlet /></main>
</div>
